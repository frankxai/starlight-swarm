<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
<defs>
  <radialGradient id="bg-ss" cx="50%" cy="50%" r="70%">
    <stop offset="0%" stop-color="#1a1200"/>
    <stop offset="100%" stop-color="#0a0a0b"/>
  </radialGradient>
  <filter id="glow-ss">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<rect width="1200" height="300" fill="url(#bg-ss)"/>

<!-- Background subtle hex grid -->
<g opacity="0.06" stroke="#f59e0b" stroke-width="1" fill="none">
  <polygon points="100,60 128,44 156,60 156,92 128,108 100,92"/>
  <polygon points="1044,60 1072,44 1100,60 1100,92 1072,108 1044,92"/>
  <polygon points="100,200 128,184 156,200 156,232 128,248 100,232"/>
  <polygon points="1044,200 1072,184 1100,200 1100,232 1072,248 1044,232"/>
</g>

<!-- Central queen hexagon (gold, large) -->
<polygon points="600,90 634,70 668,90 668,130 634,150 600,130" fill="#fbbf24" opacity="0.9" filter="url(#glow-ss)">
  <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite"/>
</polygon>
<polygon points="600,90 634,70 668,90 668,130 634,150 600,130" fill="none" stroke="#fbbf24" stroke-width="2">
  <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
</polygon>
<text x="634" y="117" fill="#0a0a0b" font-family="ui-monospace,monospace" font-size="11" font-weight="700" text-anchor="middle">QUEEN</text>

<!-- Worker hex 1 - top (amber) -->
<polygon points="606,30 624,20 642,30 642,50 624,60 606,50" fill="#f59e0b" opacity="0.75"/>
<line x1="634" y1="60" x2="634" y2="70" stroke="#f59e0b" stroke-width="1.5" opacity="0.5">
  <animate attributeName="opacity" values="0.3;0.7;0.3" dur="1.8s" repeatCount="indefinite"/>
</line>

<!-- Worker hex 2 - top-right -->
<polygon points="688,55 706,45 724,55 724,75 706,85 688,75" fill="#f59e0b" opacity="0.75"/>
<line x1="668" y1="90" x2="688" y2="75" stroke="#f59e0b" stroke-width="1.5" opacity="0.5">
  <animate attributeName="opacity" values="0.3;0.7;0.3" dur="2.1s" repeatCount="indefinite"/>
</line>

<!-- Worker hex 3 - bottom-right -->
<polygon points="688,145 706,135 724,145 724,165 706,175 688,165" fill="#f59e0b" opacity="0.75"/>
<line x1="668" y1="130" x2="688" y2="145" stroke="#f59e0b" stroke-width="1.5" opacity="0.5">
  <animate attributeName="opacity" values="0.3;0.7;0.3" dur="1.6s" repeatCount="indefinite"/>
</line>

<!-- Worker hex 4 - bottom -->
<polygon points="606,165 624,155 642,165 642,185 624,195 606,185" fill="#f59e0b" opacity="0.75"/>
<line x1="634" y1="150" x2="624" y2="155" stroke="#f59e0b" stroke-width="1.5" opacity="0.5">
  <animate attributeName="opacity" values="0.3;0.7;0.3" dur="1.9s" repeatCount="indefinite"/>
</line>

<!-- Worker hex 5 - bottom-left -->
<polygon points="544,145 562,135 580,145 580,165 562,175 544,165" fill="#f59e0b" opacity="0.75"/>
<line x1="600" y1="130" x2="580" y2="145" stroke="#f59e0b" stroke-width="1.5" opacity="0.5">
  <animate attributeName="opacity" values="0.3;0.7;0.3" dur="2.3s" repeatCount="indefinite"/>
</line>

<!-- Worker hex 6 - top-left -->
<polygon points="544,55 562,45 580,55 580,75 562,85 544,75" fill="#f59e0b" opacity="0.75"/>
<line x1="600" y1="90" x2="580" y2="75" stroke="#f59e0b" stroke-width="1.5" opacity="0.5">
  <animate attributeName="opacity" values="0.3;0.7;0.3" dur="2.0s" repeatCount="indefinite"/>
</line>

<!-- Pulse ring from queen -->
<circle cx="634" cy="110" r="60" fill="none" stroke="#fbbf24" stroke-width="1" opacity="0">
  <animate attributeName="r" values="50;90;130" dur="3s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0.5;0.2;0" dur="3s" repeatCount="indefinite"/>
</circle>

<!-- Title text -->
<text x="600" y="240" fill="#fbbf24" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="32" font-weight="700" text-anchor="middle" letter-spacing="4">STARLIGHT SWARM</text>
<text x="600" y="265" fill="#94a3b8" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="13" text-anchor="middle" letter-spacing="1">Queen-led · Fail-closed · AI income orchestration</text>

<!-- Built on SIP -->
<text x="24" y="283" fill="#f59e0b" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="11" opacity="0.8">Built on SIP</text>

<!-- Right accent line -->
<line x1="900" y1="283" x2="1176" y2="283" stroke="#f59e0b" stroke-width="0.5" opacity="0.3"/>
</svg>